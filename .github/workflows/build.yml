name: Build Clean APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android APK
        run: |
          # 1. Initialize npm project
          npm init -y

          # 2. Install Capacitor
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

          # 3. Create web asset folder and copy HTML
          mkdir -p www
          cp index.html www/index.html

          # 4. Create explicit Capacitor configuration
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.albion.refiner",
            "appName": "Albion Refiner",
            "webDir": "www"
          }
          EOF

          # 5. Add Android native platform and compile
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: Albion-Refiner-Clean-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
