name: Build Clean APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Android APK
        run: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/assets@^3.0.0
          mkdir -p www
          cp index.html www/index.html

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.albion.calculator",
            "appName": "Albion Calculator",
            "webDir": "www"
          }
          EOF

          npx cap add android

          # Generate app icons automatically from icon.png if present
          if [ -f "icon.png" ]; then
            npx @capacitor/assets generate --android --iconSource icon.png
          fi

          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: Albion-Calculator-Clean-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
